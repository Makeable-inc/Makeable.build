AWSTemplateFormatVersion: "2010-09-09"
Description: Lets GitHub Actions deploy the makeable-prod stack and the Amplify site, with no stored AWS keys. Deployed once by hand; the workflow cannot change it.

# Deploy: aws cloudformation deploy --template-file aws/github-deploy-role.yaml \
#   --stack-name makeable-github-deploy --capabilities CAPABILITY_NAMED_IAM --profile makeable

Parameters:
  Repository:
    Type: String
    Default: Makeable-inc/Makeable.build
  Environment:
    Type: String
    Default: aws-production
    Description: Only workflow jobs running in this GitHub environment can use the role. Its branch rules limit it to staging (later main).
  AppStack:
    Type: String
    Default: makeable-prod
  AmplifyAppId:
    Type: String
    Default: d1pesirg786fm3

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Assumed by the workflow. Starts deployments; does not change resources itself.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makeable-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:environment:${Environment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStack}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: TemplateChecks
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: HandOffToExecutor
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: cloudformation.amazonaws.com }
              - Sid: SamUploadBucket
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: AmplifySite
                Effect: Allow
                Action:
                  - amplify:GetApp
                  - amplify:UpdateApp
                  - amplify:GetBranch
                  - amplify:ListJobs
                  - amplify:GetJob
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource:
                  - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}
                  - !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/*
              # The smoke build signs in a throwaway user in the data bucket and deletes its records after.
              - Sid: SmokeBuildRecords
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${AppStack}-databucket-*
                  - !Sub arn:${AWS::Partition}:s3:::${AppStack}-databucket-*/*

  # Used by CloudFormation (not by GitHub) to create and change the app stack's resources.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: makeable-cfn-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-stack-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStack}-*
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRoleDescription
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStack}-*
              - Sid: Schedules
                Effect: Allow
                Action: scheduler:*
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/*
              - Sid: LogGroups
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/makeable/${AppStack}/*
              - Sid: DataBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetAccelerateConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${AppStack}-databucket-*
              - Sid: SamArtifacts
                Effect: Allow
                Action: [s3:GetObject]
                Resource: arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: ReadOnlyLookups
                Effect: Allow
                Action: [lambda:GetLayerVersion, iam:ListRoles, logs:DescribeLogGroups, scheduler:ListSchedules]
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: GitHub repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  ExecutionRoleArn:
    Description: GitHub repo variable AWS_CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt ExecutionRole.Arn
