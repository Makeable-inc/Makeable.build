[build]
  publish = "release-dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/verified-parts-catalog.csv"]

[functions."build-background"]
  included_files = ["lib/verified-parts-catalog.csv"]

[functions."build-cleanup"]
  included_files = ["lib/verified-parts-catalog.csv"]

[[redirects]]
  from = "/pilot"
  to = "/pilot-app.html"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ember"
  to = "/ember/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hologram"
  to = "/hologram/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/r/ig/makeable-build"
  to = "/?utm_source=instagram&utm_medium=organic_social&utm_campaign=makeable&utm_content=makeable_build_bio&social_account=makeable_build&social_placement=bio"
  status = 302
  force = true

[[redirects]]
  from = "/r/ig/makeable-zak"
  to = "/?utm_source=instagram&utm_medium=organic_social&utm_campaign=makeable&utm_content=makeable_zak_bio&social_account=makeable_zak&social_placement=bio"
  status = 302
  force = true

[[redirects]]
  from = "/ember/download"
  to = "https://github.com/Makeable-inc/Makeable.build/releases/download/ember-v2.0.0/Claude-Burner-2.0.0-arm64.dmg"
  status = 302
  force = true

[[headers]]
  for = "/dashboard*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ember/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/ember/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hologram/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "bluetooth=(self), camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/hologram/firmware/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/hologram/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/hologram"
