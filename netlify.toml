[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "node --check app.js && node --check landing.js && node --check pilot/app.js && node --check pilot/lib/beginner-plan.mjs && node --check pilot/lib/board-profiles.mjs && node --check lib/acquisition.mjs && node --check lib/waitlist-storage.mjs && node --check lib/waitlist-session.mjs && node --check scripts/waitlist-admin.mjs && node --check server.mjs && node --check netlify/functions/api.mjs && node --test tests/server-import.test.mjs tests/beginner-plan.test.mjs && node scripts/build-static.mjs"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/pilot"
  to = "/pilot-app.html"
  status = 200
  force = true

[[redirects]]
  from = "/ember"
  to = "/ember/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ember/download"
  to = "https://github.com/Makeable-inc/Makeable.build/releases/download/ember-v1.0.12/Claude-Burner-1.0.12-arm64.dmg"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ember/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/ember/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
